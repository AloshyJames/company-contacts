<body>

    <!-- LOGIN SCREEN -->

    <div id="loginScreen">

        <div class="login-box">

            <h1>Company Contacts</h1>

            <input
                type="email"
                id="email"
                placeholder="Username / Email"
                autocomplete="username"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
            >

            <button id="loginButton">
                Login
            </button>

            <div id="loginMessage"></div>

        </div>

    </div>


    <!-- MAIN APPLICATION -->

    <div id="app">

        <div class="container">

            <div class="header">

                <div class="header-top">

                    <div>
                        <h1>Company Contacts</h1>

                        <div class="user-email">
                            Logged in as:
                            <span id="userEmail"></span>
                        </div>
                    </div>

                    <div class="header-buttons">

                        <button id="changePasswordButton">
                            Change Password
                        </button>

                        <button id="logoutButton">
                            Logout
                        </button>

                    </div>

                </div>

            </div>


            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search contacts..."
                >

            </div>


            <div id="status">
                Loading contacts...
            </div>


            <div id="contactsList"></div>

        </div>

    </div>


    <!-- CHANGE PASSWORD MODAL -->

    <div id="passwordModal">

        <div class="modal-box">

            <h2>Change Password</h2>

            <input
                type="password"
                id="newPassword"
                placeholder="New password"
                autocomplete="new-password"
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                autocomplete="new-password"
            >

            <div class="modal-buttons">

                <button id="savePasswordButton">
                    Save Password
                </button>

                <button id="cancelPasswordButton">
                    Cancel
                </button>

            </div>

            <div id="passwordMessage"></div>

        </div>

    </div>


    <script>

        // ==========================================
        // SUPABASE SETTINGS
        // ==========================================

        const SUPABASE_URL =
            "https://vibymndzvwgrtcybipth.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_gx-fEK-9lLgzsuR-coLMZg_HIbTf3o1";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        let allContacts = [];


        // ==========================================
        // LOGIN
        // ==========================================

        document
            .getElementById("loginButton")
            .addEventListener("click", login);


        async function login() {

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;

            const message =
                document.getElementById("loginMessage");


            message.textContent = "";


            if (!email || !password) {

                message.textContent =
                    "Please enter your email and password.";

                return;
            }


            const { data, error } =
                await supabaseClient.auth.signInWithPassword({

                    email: email,
                    password: password

                });


            if (error) {

                message.textContent =
                    error.message;

                return;
            }


            showApplication(data.user);
        }


        // Allow Enter key to login

        document
            .getElementById("password")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {

                    login();

                }

            });


        // ==========================================
        // SHOW APPLICATION
        // ==========================================

        function showApplication(user) {

            document
                .getElementById("loginScreen")
                .style.display = "none";

            document
                .getElementById("app")
                .style.display = "block";

            document
                .getElementById("userEmail")
                .textContent = user.email;

            loadContacts();
        }


        // ==========================================
        // CHECK EXISTING SESSION
        // ==========================================

        async function checkSession() {

            const { data } =
                await supabaseClient.auth.getSession();


            if (data.session) {

                showApplication(
                    data.session.user
                );

            }

        }


        // ==========================================
        // LOGOUT
        // ==========================================

        document
            .getElementById("logoutButton")
            .addEventListener("click", async function() {

                await supabaseClient.auth.signOut();

                location.reload();

            });


        // ==========================================
        // LOAD CONTACTS
        // ==========================================

        async function loadContacts() {

            const status =
                document.getElementById("status");


            const { data, error } =
                await supabaseClient
                    .from("contacts")
                    .select("*")
                    .order("name");


            if (error) {

                status.textContent =
                    "Unable to load contacts: " +
                    error.message;

                return;
            }


            allContacts = data || [];

            displayContacts(allContacts);
        }


        // ==========================================
        // DISPLAY CONTACTS
        // ==========================================

        function displayContacts(contacts) {

            const list =
                document.getElementById("contactsList");

            const status =
                document.getElementById("status");


            list.innerHTML = "";


            if (!contacts.length) {

                status.textContent =
                    "No contacts found.";

                return;
            }


            status.textContent =
                contacts.length +
                " contact(s)";


            contacts.forEach(function(contact) {

                const div =
                    document.createElement("div");

                div.className = "contact";


                const name =
                    document.createElement("h3");

                name.textContent =
                    contact.name || "";


                const phone =
                    document.createElement("p");

                phone.textContent =
                    "Phone: " +
                    (contact.phone || "");


                const email =
                    document.createElement("p");

                email.textContent =
                    "Email: " +
                    (contact.email || "");


                const buttons =
                    document.createElement("div");

                buttons.className =
                    "contact-buttons";


                if (contact.phone) {

                    const call =
                        document.createElement("a");

                    call.href =
                        "tel:" +
                        contact.phone.replace(
                            /[^0-9+]/g,
                            ""
                        );

                    call.textContent =
                        "Call";

                    call.className =
                        "call-button";

                    call.style.textDecoration =
                        "none";

                    call.style.padding =
                        "11px 16px";

                    call.style.borderRadius =
                        "7px";

                    buttons.appendChild(call);

                }


                if (contact.email) {

                    const mail =
                        document.createElement("a");

                    mail.href =
                        "mailto:" +
                        contact.email;

                    mail.textContent =
                        "Email";

                    mail.className =
                        "email-button";

                    mail.style.textDecoration =
                        "none";

                    mail.style.padding =
                        "11px 16px";

                    mail.style.borderRadius =
                        "7px";

                    buttons.appendChild(mail);

                }


                div.appendChild(name);
                div.appendChild(phone);
                div.appendChild(email);
                div.appendChild(buttons);

                list.appendChild(div);

            });

        }


        // ==========================================
        // SEARCH
        // ==========================================

        document
            .getElementById("searchInput")
            .addEventListener("input", function() {

                const search =
                    this.value
                        .toLowerCase()
                        .trim();


                const filtered =
                    allContacts.filter(function(contact) {

                        return (

                            (contact.name || "")
                                .toLowerCase()
                                .includes(search)

                            ||

                            (contact.phone || "")
                                .toLowerCase()
                                .includes(search)

                            ||

                            (contact.email || "")
                                .toLowerCase()
                                .includes(search)

                        );

                    });


                displayContacts(filtered);

            });


        // ==========================================
        // CHANGE PASSWORD
        // ==========================================

        document
            .getElementById("changePasswordButton")
            .addEventListener("click", function() {

                document
                    .getElementById("passwordModal")
                    .style.display = "block";

                document
                    .getElementById("newPassword")
                    .value = "";

                document
                    .getElementById("confirmPassword")
                    .value = "";

                document
                    .getElementById("passwordMessage")
                    .textContent = "";

            });


        // Close password window

        document
            .getElementById("cancelPasswordButton")
            .addEventListener("click", function() {

                document
                    .getElementById("passwordModal")
                    .style.display = "none";

            });


        // Save new password

        document
            .getElementById("savePasswordButton")
            .addEventListener("click", async function() {

                const newPassword =
                    document
                        .getElementById("newPassword")
                        .value;

                const confirmPassword =
                    document
                        .getElementById("confirmPassword")
                        .value;

                const message =
                    document
                        .getElementById("passwordMessage");


                message.textContent = "";


                if (!newPassword ||
                    !confirmPassword) {

                    message.textContent =
                        "Please enter the new password.";

                    return;
                }


                if (newPassword !== confirmPassword) {

                    message.textContent =
                        "Passwords do not match.";

                    return;
                }


                if (newPassword.length < 8) {

                    message.textContent =
                        "Password must be at least 8 characters.";

                    return;
                }


                const { error } =
                    await supabaseClient.auth.updateUser({

                        password: newPassword

                    });


                if (error) {

                    message.textContent =
                        error.message;

                    return;
                }


                message.textContent =
                    "Password changed successfully.";


                document
                    .getElementById("newPassword")
                    .value = "";

                document
                    .getElementById("confirmPassword")
                    .value = "";

            });


        // ==========================================
        // START APPLICATION
        // ==========================================

        checkSession();

    </script>

</body>
</html>
