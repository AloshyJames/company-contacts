<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Company Contacts</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        header p {
            margin: 6px 0 0;
            opacity: 0.8;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 15px;
        }

        #search {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .contact {
            background: white;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .contact h2 {
            margin: 0 0 6px;
            font-size: 20px;
        }

        .department {
            color: #666;
            margin-bottom: 12px;
        }

        .button {
            display: block;
            text-decoration: none;
            padding: 12px;
            margin-top: 8px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        .call {
            background: #e8f5e9;
            color: #1b5e20;
        }

        .email {
            background: #e3f2fd;
            color: #0d47a1;
        }

        .no-results {
            text-align: center;
            color: #777;
            display: none;
            padding: 30px;
        }
    </style>
</head>

<body>

<header>
    <h1>📱 Company Contacts</h1>
    <p>Employee Directory</p>
</header>

<div class="container">

    <input
        type="text"
        id="search"
        placeholder="🔍 Search by name or department..."
        onkeyup="searchContacts()"
    >

    <div id="contacts">

        <div class="contact">
            <h2>John Smith</h2>
            <div class="department">IT Department</div>

            <a class="button call" href="tel:0211234567">
                📞 Call 021 123 4567
            </a>

            <a class="button email" href="mailto:john@example.com">
                ✉️ Email John
            </a>
        </div>


        <div class="contact">
            <h2>Sarah Jones</h2>
            <div class="department">Finance Department</div>

            <a class="button call" href="tel:0215551234">
                📞 Call 021 555 1234
            </a>

            <a class="button email" href="mailto:sarah@example.com">
                ✉️ Email Sarah
            </a>
        </div>


        <div class="contact">
            <h2>David Brown</h2>
            <div class="department">Operations Department</div>

            <a class="button call" href="tel:0218889999">
                📞 Call 021 888 9999
            </a>

            <a class="button email" href="mailto:david@example.com">
                ✉️ Email David
            </a>
        </div>

    </div>

    <div id="noResults" class="no-results">
        No contacts found.
    </div>

</div>


<script>

function searchContacts() {

    const searchText =
        document.getElementById("search")
        .value
        .toLowerCase();

    const contacts =
        document.getElementsByClassName("contact");

    let found = 0;

    for (let i = 0; i < contacts.length; i++) {

        const contactText =
            contacts[i].innerText.toLowerCase();

        if (contactText.includes(searchText)) {

            contacts[i].style.display = "block";
            found++;

        } else {

            contacts[i].style.display = "none";

        }
    }

    document.getElementById("noResults").style.display =
        found === 0 ? "block" : "none";
}

</script>

</body>
</html>
