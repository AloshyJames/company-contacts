<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Company Contacts</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f4e79;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 12px;
        }

        #search {
            width: 100%;
            max-width: 500px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        #contacts {
            max-width: 700px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .contact {
            background: white;
            padding: 18px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .contact h2 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .contact p {
            margin: 6px 0;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .buttons a {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 7px;
            text-decoration: none;
            color: white;
        }

        .call {
            background: #198754;
        }

        .email {
            background: #0d6efd;
        }

        #message {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>Company Contacts</h1>
    <input
        type="text"
        id="search"
        placeholder="Search name, department, phone..."
    >
</header>

<div id="message">Loading contacts...</div>

<div id="contacts"></div>

<script>

    // ==========================================
    // PUT YOUR SUPABASE DETAILS HERE
    // ==========================================

    const SUPABASE_URL = "https://vibymndzvwgrtcybipth.supabase.co";

    const SUPABASE_KEY = "sb_publishable_gx-fEK-9lLgzsuR-coLMZg_HIbTf3o1";


    // ==========================================
    // CONNECT TO SUPABASE
    // ==========================================

    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


    let allContacts = [];


    // ==========================================
    // LOAD CONTACTS
    // ==========================================

    async function loadContacts() {

        const { data, error } = await supabaseClient
            .from("contacts")
            .select("*")
            .order("name");

        if (error) {

            console.error(error);

            document.getElementById("message").textContent =
                "Unable to load contacts.";

            return;
        }

        allContacts = data;

        displayContacts(allContacts);
    }


    // ==========================================
    // DISPLAY CONTACTS
    // ==========================================

    function displayContacts(contacts) {

        const container = document.getElementById("contacts");

        container.innerHTML = "";

        document.getElementById("message").textContent =
            contacts.length + " contact(s)";


        contacts.forEach(contact => {

            const card = document.createElement("div");

            card.className = "contact";

            card.innerHTML = `

                <h2>${escapeHtml(contact.name || "")}</h2>

                <p>
                    📞 ${escapeHtml(contact.phone || "No phone")}
                </p>

                <p>
                    ✉️ ${escapeHtml(contact.email || "No email")}
                </p>

                <div class="buttons">

                    ${
                        contact.phone
                        ? `<a class="call"
                             href="tel:${encodeURIComponent(contact.phone)}">
                             Call
                           </a>`
                        : ""
                    }

                    ${
                        contact.email
                        ? `<a class="email"
                             href="mailto:${encodeURIComponent(contact.email)}">
                             Email
                           </a>`
                        : ""
                    }

                </div>
            `;

            container.appendChild(card);

        });
    }


    // ==========================================
    // SEARCH
    // ==========================================

    document.getElementById("search").addEventListener(
        "input",
        function () {

            const searchText =
                this.value.toLowerCase().trim();

            const filtered = allContacts.filter(contact => {

                return (
                    (contact.name || "").toLowerCase().includes(searchText) ||
                    (contact.phone || "").toLowerCase().includes(searchText) ||
                    (contact.email || "").toLowerCase().includes(searchText)
                );

            });

            displayContacts(filtered);

        }
    );


    // ==========================================
    // SECURITY
    // ==========================================

    function escapeHtml(text) {

        const div = document.createElement("div");

        div.textContent = text;

        return div.innerHTML;
    }


    // ==========================================
    // START
    // ==========================================

    loadContacts();

</script>

</body>
</html>
